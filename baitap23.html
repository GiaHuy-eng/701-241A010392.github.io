AYAIkaIkAAJESAAGJQObSBzcABcfIma7bfz131EmShfM0AB6M/9mIS7LYABziPGiRzYAE+SoiDAAFH/2Q==";
  const photos = [MY_PHOTO, MY_PHOTO, MY_PHOTO, MY_PHOTO, MY_PHOTO, MY_PHOTO];

  const FACES = photos.length;
  const STEP = 360 / FACES;
  const WIDTH = 240;
  const RADIUS = (WIDTH / 2) / Math.tan(Math.PI / FACES) + 6;

  const ring = document.getElementById("ring");
  const status = document.getElementById("status");

  function placeholder(n) {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320">' +
      '<rect width="100%" height="100%" fill="#3a3560"/>' +
      '<text x="50%" y="52%" fill="#f2b134" font-size="64" font-family="sans-serif" text-anchor="middle">' + n + '</text></svg>';
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  let angle = 0, paused = false, last = null;
  const SPEED = 0.03;

  photos.forEach((src, i) => {
    const face = document.createElement("div");
    face.className = "face";
    face.style.transform = "rotateY(" + (i * STEP) + "deg) translateZ(" + RADIUS + "px)";

    const img = document.createElement("img");
    img.src = src;
    img.alt = "Ảnh " + (i + 1);
    img.onerror = function () { img.onerror = null; img.src = placeholder(i + 1); };
    face.appendChild(img);

face.addEventListener("mouseenter", function () { paused = true; status.textContent = "Đang xem ảnh " + (i + 1); });
    face.addEventListener("mouseleave", function () { paused = false; status.textContent = "Đèn đang quay"; });

    ring.appendChild(face);
  });

  function animate(now) {
    if (last !== null && !paused) angle += (now - last) * SPEED;
    last = now;
    ring.style.transform = "translateZ(-" + RADIUS + "px) rotateX(-8deg) rotateY(" + (-angle) + "deg)";
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
</script>
